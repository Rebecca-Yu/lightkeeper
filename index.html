<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lightkeeper</title>
    <link rel="icon" type="image/svg" href="../images/favicon/lightbulb-fill.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="./css/custom.css" rel="stylesheet">
</head>
<body>

    <!-- PASSWORD CONTENT -->
    <div class="grid position-absolute top-50 start-50 translate-middle">
        <div class="card p-4 bg-dark">
            <div class="card-header">
                <input type="input" class="p-3 form-control text-dark fw-bold pinpad text-center" id="pinpad-input" readonly>
            </div>
            <div>
                <div class="row">
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="1">1</button>
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="2">2</button>
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="3">3</button>
                </div>
                <div class="row">
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="4">4</button>
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="5">5</button>
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="6">6</button>
                </div>
                <div class="row">
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="7">7</button>
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="8">8</button>
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="9">9</button>
                </div>
                <div class="row">
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="del" id="delete-btn">del</button>
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="0">0</button>
                    <button type="button" class="col btn btn-dark pinpad-btn fw-bold" value="ok" id="submit-btn">ok</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./js/custom.js"></script>
</body>
</html>
