<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>enlighten-me</title>
        <link rel="icon" type="image/svg" href="../images/favicon/snow.svg">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="../css/custom.css" rel="stylesheet">
        <link href="../css/enlighten-me.css" rel="stylesheet">
    </head>
    <body>
        <!-- HOME NAV BAR -->
        <div class="pt-3 pb-2 ps-3 bg-dark">
            <h6><a href="../index.html"><i class="bi bi-house home"></i></a></h6>
        </div>

        <div class="container-fluid">
            <div class="row pt-5">
                <!-- LEFT COLUMN -->
                <div class="col-1 d-flex flex-column align-items-center p-4 gap-4">
                    <button class="btn btn-outline-danger" id="restartBtn" data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="Restart">
                        <i class="bi bi-arrow-clockwise fs-3"></i>
                    </button>

                    <button class="btn btn-outline-success" id="nextBtn" data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="Next Round">
                        <i class="bi bi-arrow-right fs-3"></i>
                    </button>
                </div>

                <!-- CENTER -->
                <div class="col-8 col-md-10">   
                    <div class="incorrect-bar pb-3 pe-2 d-flex justify-content-end" id="incorrectBar"></div>
                    <div class="card py-2">
                        <div class="card-body">
                            <div id="clueBox" class="text-center bell-font"></div>

                            <div id="wordBox" class="bell-font d-flex gap-1 flex-wrap justify-content-center pt-3 pb-5"></div>

                            <div id="message" class="message card-footer text-center bell-font"></div>
                        </div>
                    </div>
                    <div class="py-3">
                        <div id="letters" class="letters bell-font d-flex gap-2 flex-wrap justify-content-center"></div>
                    </div>
                </div>

                <!-- RIGHT COLUMN -->
                <div class="col-2 col-md-1 d-flex flex-column align-items-center pt-4 gap-4">
                    <div class="text-center text-light bell-font">
                        <h5>Question</h5>
                        <h2 id="questionIndex">0</h2>
                    </div>

                    <div class="text-center text-light bell-font">
                        <h5>Score</h5>
                        <h2 id="score">0</h2>
                    </div>
                </div>

            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="../js/custom.js"></script>
        <script src="../js/enlighten-me.js"></script>
    </body>
</html>
