<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>secret-recipe</title>
        <link rel="icon" type="image/svg" href="../images/favicon/fork-knife.svg">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="../css/custom.css" rel="stylesheet">
        <link href="../css/secret-recipe.css" rel="stylesheet">
    </head>
    <body>
        <!-- HOME NAV BAR -->
        <div class="pt-3 pb-2 ps-3 bg-dark">
            <h6><a href="../index.html"><i class="bi bi-house home"></i></a></h6>
        </div>

        <div class="container-fluid bell-font">
            <div class="row pt-5">
                <!-- LEFT COLUMN -->
                <div class="col-1 d-flex flex-column align-items-center p-4 gap-4">
                    <button class="btn btn-outline-danger" id="restartBtn" data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="Restart">
                        <i class="bi bi-arrow-clockwise fs-3"></i>
                    </button>
                </div>

                <!-- CENTER -->
                <div class="col-8 col-md-10">  
                    <div class="card mb-3">
                        <div class="card-body">
                            <!-- Level Selection -->
                            <div class="d-flex justify-content-end pb-3">
                                <div class="btn-toolbar" role="toolbar">
                                    <div class="btn-group me-2" role="group">
                                        <button class="btn btn-outline-dark" id="level1Btn">Level 1</button>
                                        <button class="btn btn-outline-dark" id="level2Btn">Level 2</button>
                                        <button class="btn btn-outline-dark" id="level3Btn">Level 3</button>
                                    </div>
                                    <div class="btn-group" role="group">
                                        <button id="nextQuestionBtn" class="btn btn-secondary" disabled>
                                            <i class="bi bi-arrow-right"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Dish Name -->
                            <h2 id="dishName" class="card-title text-center pb-4">Choose a level to begin.</h2>
                            
                            <!-- Method placeholder (Level 3 only) -->
                            <div id="methodSection" class="mb-3 d-none">
                                <h6>Cooking Method</h6>
                                <div>
                                    <div id="methodPlaceholders" class="placeholder-box single-placeholder mb-3 text-center"
                                        data-slot-type="method"
                                        data-slot-index="0">
                                        click/ drop method here
                                    </div>
                                </div>
                                <div id="methodOptions" class="d-flex flex-wrap mb-6 pb-5"></div>
                            </div>

                            <!-- Ingredient placeholders -->
                            <div id="ingredientSection" class="mb-3 d-none">
                                <h6>Ingredient</h6>
                                <div id="ingredientPlaceholders" class="mb-3 text-center"></div>
                                <div id="ingredientOptions" class="d-flex flex-wrap pb-5"></div>
                            </div>

                            <!-- Submit -->
                            <div class="mt-3 d-flex justify-content-between align-items-center">
                                <button id="checkBtn" class="btn btn-success" disabled>Check Answer</button>
                                <span id="feedback" class="fw-bold"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- RIGHT COLUMN -->
                <div class="col-2 col-md-1 d-flex flex-column align-items-center pt-4 gap-4">
                    <div class="text-center text-light bell-font">
                        <h5>Score</h5>
                        <h2 id="scoreDisplay">0</h2>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="../js/custom.js"></script>
        <script src="../js/secret-recipe.js"></script>
    </body>
</html>
