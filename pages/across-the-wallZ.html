<!DOCTYPE html>
<html lang="en" data-room="Z">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>across-the-wall-room-2</title>
        <link rel="icon" type="image/svg" href="../images/favicon/broadcast-pin.svg">
        <link href="../lib/css/bootstrap.min.css" rel="stylesheet">
        <link href="../lib/css/bootstrap-icons.min.css" rel="stylesheet">
        <link href="../css/custom.css" rel="stylesheet">
        <link href="../css/across-the-wall.css" rel="stylesheet">
    </head>
    <body>
        <!-- HOME NAV BAR -->
        <div class="pt-3 pb-2 ps-3 bg-dark">
            <h6><a href="../index.html"><i class="bi bi-house home"></i></a></h6>
        </div>

        <!-- START SCREEN -->
        <div id="startScreen" class="grid position-absolute top-50 start-50 translate-middle">
            <button id="startBtn" class="btn btn-dark bell-font fs-1 px-5 py-3">Start Game</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="gameScreen" hidden>
            <div class="text-center text-warning bell-font pt-3 fs-2" id="gameTimer">00:00</div>
            <div class="container-fluid">
                <div class="row">
                    <!-- LEFT COLUMN -->
                    <div class="col-1 d-flex flex-column align-items-center p-4 gap-4">
                        <button class="btn btn-outline-danger" id="restartBtn" data-bs-toggle="tooltip" data-bs-placement="right" data-bs-title="Restart">
                            <i class="bi bi-arrow-clockwise fs-3"></i>
                        </button>
                    </div>

                    <!-- CENTER -->
                    <div class="col-8 col-md-10">   
                        <div class="card py-2">
                            <div class="card-body">
                                <div class="d-flex justify-content-end pb-3">
                                    <button type="button" class="btn btn-dark m-1" id="prevBtn" data-bs-toggle="tooltip" data-bs-title="Previous Question" disabled>
                                        <i class="bi bi-arrow-left"></i>
                                    </button>
                                    <button class="btn btn-dark m-1" id="nextBtn" data-bs-toggle="tooltip" data-bs-title="Next Question" disabled>
                                        <i class="bi bi-arrow-right"></i>
                                    </button>
                                </div>

                                <div id="questionText1" class="fw-bold mb-2 text-center bell-font fs-3"></div>
                                <div id="questionText2" class="mb-5 text-center bell-font"></div>
                                <div id="answerArea" class="mb-3 justify-content-center"></div>

                                <div id="feedback" class="mt-3 text-center bell-font fs-3"></div>

                                <div class="d-flex justify-content-end pb-2">
                                    <button id="checkBtn" class="btn btn-dark m-1 bell-font" data-bs-toggle="tooltip" data-bs-title="Submit Answer">Submit</button>
                                </div>
                            </div>
                        </div>

                        <!-- TIME'S UP POP UP -->
                        <div class="modal fade" id="timeUpModal" tabindex="-1">
                            <div class="modal-dialog modal-dialog-centered">
                                <div class="modal-content">
                                    <div class="modal-header">
                                        <h4 id="timeModalHeader" class="modal-title bell-font text-danger">Time's Up!</h4>
                                    </div>
                                    <div class="modal-body bell-font">
                                        <h3>Your Final Score</h3>
                                        <h1 id="finalScore">0</h1>
                                        <p class="mt-3 text-muted">
                                            <i class="bi bi-exclamation-triangle-fill"></i> Reminder: This station's score is the sum of the scores from both rooms.
                                        </p>
                                        <div class="justify-content-end d-flex p-3">
                                            <button id="closeModal" class="btn btn-danger" data-bs-dismiss="modal">Restart Game</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT COLUMN -->
                    <div class="col-2 col-md-1 d-flex flex-column align-items-center pt-4 gap-4">
                        <div class="text-center text-light bell-font">
                            <h5>Question</h5>
                            <h2 id="questionIndex">0</h2>
                        </div>

                        <div class="text-center text-light bell-font">
                            <h5>Score</h5>
                            <h2 id="score">0</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        

        <script src="../lib/js/bootstrap.bundle.min.js"></script>
        <script src="../assets/js/AcrossTheWall.js"></script>
        <script src="../js/across-the-wall.js"></script>
    </body>
</html>
